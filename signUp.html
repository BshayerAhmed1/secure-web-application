<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header nav {
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    header img {
      border-radius: 5px;
      margin-left: 8px;
      height: 90%;
      width: 99%;
    }

    .navbar ul {
      list-style-type: none;
      padding: 0;
    }

    .navbar li {
      display: inline;
      margin-right: 20px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    /* Sign Up Section */
    .signup-section {
      max-width: 600px;
      margin: 50px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .signup-form input[type="text"],
    .signup-form input[type="email"],
    .signup-form input[type="password"],
    .signup-form input[type="number"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .signup-form input[type="submit"],
    .signup-form button {
      background-color: #66acde;
      color: white;
      padding: 12px 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      width: 100%;
      font-size: 16px;
    }

    .signup-form input[type="submit"]:hover,
    .signup-form button:hover {
      background-color: #6dded5;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: -5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #333;
      color: white;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <header>
    <nav></nav>
    <img src="Picturs/OIC4.png" alt="pic1">
  </header>

  <main>
    <section class="signup-section">
      <h1>Create Your Account</h1>

      <form id="signupForm" class="signup-form" action="signup.php" method="POST">
        <input type="text" id="username" placeholder="Username" name="username" required>
        <div id="usernameError" class="error"></div>

        <input type="email" id="email" placeholder="Email" name="email" required>
        <div id="emailError" class="error"></div>

        <button type="button" id="sendCodeButton">Send Verification Code</button>

        <div id="verificationSection" style="display: none;">
          <input type="number" id="verificationCode" placeholder="Enter Verification Code" required>
          <div id="codeError" class="error"></div>
        </div>

        <input type="password" id="password" placeholder="Password" name="password" required style="display: none;">
        <div id="passwordError" class="error"></div>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" name="confirm-password" required style="display: none;">
        <div id="confirmPasswordError" class="error"></div>

        <input type="submit" value="Sign Up" style="display: none;">
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 My Website. All rights reserved.</p>
  </footer>

  <script>
    let verificationCode = null;

    function generateOTP() {
      return Math.floor(100000 + Math.random() * 900000); // random 6-digit OTP
    }

    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const sendCodeButton = document.getElementById('sendCodeButton');
    const verificationSection = document.getElementById('verificationSection');
    const verificationCodeInput = document.getElementById('verificationCode');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitButton = document.querySelector('input[type="submit"]');

    const usernameError = document.getElementById('usernameError');
    const emailError = document.getElementById('emailError');
    const codeError = document.getElementById('codeError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');

    usernameInput.addEventListener('input', () => {
      const username = usernameInput.value;
      const usernameRegex = /^(?=.*[A-Za-z])[A-Za-z0-9]{4,}$/;
      const isOnlyNumbers = /^[0-9]+$/;

      if (!usernameRegex.test(username)) {
        if (username.match(/[^A-Za-z0-9]/)) {
          usernameError.textContent = 'Special characters are not allowed in the username.';
        } else if (isOnlyNumbers.test(username)) {
          usernameError.textContent = 'Username cannot consist of numbers only. Please include letters.';
        } else {
          usernameError.textContent = 'Username must be at least 4 characters long and include only letters and numbers.';
        }
      } else if (username === 'Ghena') { // Uerename check
        usernameError.textContent = 'Username is already taken. Please choose a different one.';
      } else {
        usernameError.textContent = '';
      }
    });

    emailInput.addEventListener('input', () => {
      const email = emailInput.value;
      const emailRegex = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/;
      if (!emailRegex.test(email)) {
        emailError.textContent = 'Please enter a valid email address (e.g., user@example.com).';
      } else if (email === 'Ghena@gmail.com') { // check للايميل وجود
        emailError.textContent = 'This email is already in use. Please try a different one.';
      } else {
        emailError.textContent = '';
      }
    });

    sendCodeButton.addEventListener('click', () => {
      if (emailError.textContent === '') {
        verificationCode = generateOTP();
        alert(`Verification code sent to your email: ${verificationCode}`); 
        verificationSection.style.display = 'block';
      } else {
        alert('Please enter a valid email before proceeding.');
      }
    });

    verificationCodeInput.addEventListener('input', () => {
      if (verificationCodeInput.value == verificationCode) {
        codeError.textContent = '';
        passwordInput.style.display = 'block';
        confirmPasswordInput.style.display = 'block';
        submitButton.style.display = 'block';
      } else {
        codeError.textContent = 'Incorrect verification code.';
      }
    });

    passwordInput.addEventListener('input', () => {
  const password = passwordInput.value;
  const hasUppercase = /[A-Z]/.test(password);
  const hasNumber = /[0-9]/.test(password); // تحقق من وجود رقم
  const hasSpecialChar = /[!@#$%^&*]/.test(password); // تحقق من وجود حرف سبشل

  if (password.length < 8) {
    passwordError.textContent = 'Password must be at least 8 characters long.';
  } else if (!hasUppercase) {
    passwordError.textContent = 'Password must contain at least one uppercase letter.';
  } else if (!hasNumber) {
    passwordError.textContent = 'Password must contain at least one number.';
  } else if (!hasSpecialChar) {
    passwordError.textContent = 'Password must contain at least one special character.';
  } else {
    passwordError.textContent = '';
  }
});

    confirmPasswordInput.addEventListener('input', () => {
      if (confirmPasswordInput.value !== passwordInput.value) {
        confirmPasswordError.textContent = 'Passwords do not match.';
      } else {
        confirmPasswordError.textContent = '';
      }
    });

    submitButton.addEventListener('click', (event) => {
  event.preventDefault(); // Prevent form from submitting

  // Check if there are any validation errors
  if (usernameError.textContent === '' && emailError.textContent === '' && 
      codeError.textContent === '' && passwordError.textContent === '' && 
      confirmPasswordError.textContent === '') {
    
    // Redirect to the home page after successful signup
    window.location.href = 'homeafterlogin.html'; // Adjust the path as needed
  } else {
    alert('Please fix the errors before submitting.');
  }
});
  </script>
</body>
</html>
